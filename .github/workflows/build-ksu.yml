name: Build KernelSU LKM

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_ksu:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          tool-cache: true
          swap-storage: true

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libelf-dev zlib1g-dev libssl-dev bc dwarves pahole bison flex

      - name: Setup GKI Source & KSU
        run: |
          git clone --depth=1 https://android.googlesource.com/kernel/common -b android12-5.10 gki_kernel
          wget -O gki_kernel/Module.symvers "https://github.com/isaquxet08-ai/Kernel-Builder-GKI-Susfs/releases/download/build-55-force/Module.symvers"
          git clone --depth=1 https://github.com/tiann/KernelSU.git
          
          # 🚨 修复 1：正确拷贝 kernel 源码和 uapi 头文件
          cp -r KernelSU/kernel gki_kernel/drivers/kernelsu
          mkdir -p gki_kernel/include/uapi
          cp -r KernelSU/uapi/* gki_kernel/include/uapi/
          
          # 🚨 修复 2：物理切除 preinit 模块，绕开 runner.elf 交叉编译错误
          sed -i '/preinit/d' gki_kernel/drivers/kernelsu/Makefile

      - name: Download Clang Toolchain
        run: |
          wget -q https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.0.0_r1/clang-r416183b.tar.gz
          mkdir -p clang
          tar -xzf clang-r416183b.tar.gz -C clang
          echo "$PWD/clang/bin" >> $GITHUB_PATH

      - name: Build Module
        run: |
          cd gki_kernel
          make ARCH=arm64 gki_defconfig
          make ARCH=arm64 olddefconfig
          
          # 准备编译环境
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- modules_prepare
          
          # 单独编译 selinux 目录生成 flask.h
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- security/selinux/
          
          # 编译 KSU 模块
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- CONFIG_KSU=m M=drivers/kernelsu modules
          
          # 提取出编译好的 .ko
          find . -name "*.ko" -exec cp {} ../ \;

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ksu-lkm-${{ github.run_number }}
          name: KernelSU LKM Build ${{ github.run_number }}
          draft: false
          prerelease: true
          files: "*.ko"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
