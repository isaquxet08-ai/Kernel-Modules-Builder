name: Build KernelSU LKM

on:
  workflow_dispatch:

jobs:
  build_ksu:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          tool-cache: true
          swap-storage: true

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libelf-dev zlib1g-dev libssl-dev bc dwarves pahole bison flex

      - name: Setup GKI Source & KSU
        run: |
          git clone --depth=1 https://android.googlesource.com/kernel/common -b android12-5.10 gki_kernel
          wget -O gki_kernel/Module.symvers "https://github.com/isaquxet08-ai/Kernel-Builder-GKI-Susfs/releases/download/build-55-force/Module.symvers"
          git clone --depth=1 https://github.com/tiann/KernelSU.git
          cp -r KernelSU/kernel gki_kernel/drivers/kernelsu

      - name: Download Clang Toolchain
        run: |
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.0.0_r1/clang-r416183b.tar.gz
          mkdir -p clang
          tar -xzf clang-r416183b.tar.gz -C clang
          echo "$PWD/clang/bin" >> $GITHUB_PATH

      - name: Build Module
        run: |
          cd gki_kernel
          make ARCH=arm64 gki_defconfig
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- modules_prepare
          make ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- M=drivers/kernelsu modules
          find . -name "*.ko" -exec cp {} ../ \;

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernelsu-lkm
          path: "*.ko"
