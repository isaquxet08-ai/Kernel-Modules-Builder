name: Build Custom DDK Docker Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write # 🚨 必须赋予写入包仓库的权限

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout My Repo
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Custom DDK
        run: |
          echo ">>> 1. 编写专属 Dockerfile..."
          cat > Dockerfile << 'DOCKER_EOF'
          # 使用官方的 android12-5.10 镜像作为底包
          FROM ghcr.io/ylarod/ddk-min:android12-5.10-20260828
          
          # 将你本地仓库的符号表直接 COPY 进去覆盖
          COPY Module.symvers /opt/ddk/src/android12-5.10/Module.symvers
          
          # 🚨 在镜像构建阶段完成所有准备工作，一劳永逸！
          RUN cd /opt/ddk/src/android12-5.10 && \
              export ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu- && \
              touch vmlinux && \
              make gki_defconfig && \
              make modules_prepare && \
              make security/selinux/
          DOCKER_EOF
          
          echo ">>> 2. 开始构建镜像（这步可能需要几分钟）..."
          # GitHub 容器仓库的路径必须全小写
          IMAGE_NAME=ghcr.io/isaquxet08-ai/ddk-custom:android12-5.10
          docker build -t $IMAGE_NAME .
          
          echo ">>> 3. 推送到云端包仓库..."
          docker push $IMAGE_NAME
