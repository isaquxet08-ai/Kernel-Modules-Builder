name: Build KernelSU LKM (Ultimate)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-lkm:
    runs-on: ubuntu-latest
    # 🚨 核心：直接使用你刚造好的“满配专属镜像”！
    container:
      image: ghcr.io/isaquxet08-ai/ddk-custom:android12-5.10
      options: --privileged

    steps:
    - name: Checkout KernelSU Source
      uses: actions/checkout@v4
      with:
        repository: tiann/KernelSU
        path: ksu_src

    - name: Build and Rescue
      run: |
        git config --global --add safe.directory $GITHUB_WORKSPACE/ksu_src
        cd $GITHUB_WORKSPACE/ksu_src/kernel
        
        echo ">>> 开始编译 KSU 模块..."
        # 🚨 因为环境完美无瑕，直接闭着眼睛 make，如果报错也继续往下走兜底
        export KDIR="/opt/ddk/src/android12-5.10"
        CONFIG_KSU=m CC=clang make || echo "⚠️ make 报错，准备强行打捞..."
        
        echo ">>> 强行打捞产物..."
        mkdir -p $GITHUB_WORKSPACE/out
        if [ -f kernelsu.ko ]; then
          cp kernelsu.ko "$GITHUB_WORKSPACE/out/android12-5.10_kernelsu.ko"
          llvm-strip -d "$GITHUB_WORKSPACE/out/android12-5.10_kernelsu.ko" || true
          ls -lh "$GITHUB_WORKSPACE/out/android12-5.10_kernelsu.ko"
          
          # 发布到 Release
          gh release create ultimate-lkm-${{ github.run_number }} $GITHUB_WORKSPACE/out/*.ko --repo isaquxet08-ai/Kernel-Modules-Builder || true
        else
          echo "❌ 没找到 kernelsu.ko，这次真沉底了"
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
