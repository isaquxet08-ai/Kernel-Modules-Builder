name: Build KernelSU LKM (Ultimate)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-lkm:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/isaquxet08-ai/ddk-custom:android12-5.10
      options: --privileged

    steps:
    - name: Checkout KernelSU Source
      uses: actions/checkout@v4
      with:
        repository: tiann/KernelSU
        path: ksu_src

    - name: Build and Upload inside Container
      run: |
        # 初始化 gh 认证（利用 secrets 注入的环境变量）
        export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
        
        git config --global --add safe.directory $GITHUB_WORKSPACE/ksu_src
        cd $GITHUB_WORKSPACE/ksu_src/kernel
        
        echo ">>> 终极物理阉割：重写 check_symbol.c..."
        rm -f tools/check_symbol
        echo '#include <stdio.h>' > tools/check_symbol.c
        echo 'int main(int argc, char** argv) { return 0; }' >> tools/check_symbol.c
        
        echo ">>> 开始编译 KSU 模块..."
        export KDIR="/opt/ddk/src/android12-5.10"
        CONFIG_KSU=m CC=clang make || echo "⚠️ 编译报错，准备强行打捞..."
        
        echo ">>> 强行打捞并发布..."
        if [ -f kernelsu.ko ]; then
          llvm-strip -d kernelsu.ko || true
          # 🚨 核心：利用容器内的 gh 直接创建发行版并上传
          gh release create ksu-lkm-${{ github.run_number }} kernelsu.ko \
            --title "KernelSU LKM ${{ github.run_number }}" \
            --notes "Built inside custom DDK." \
            --repo isaquxet08-ai/Kernel-Modules-Builder || \
          gh release upload ksu-lkm-${{ github.run_number }} kernelsu.ko --clobber --repo isaquxet08-ai/Kernel-Modules-Builder
        else
          echo "❌ 没找到 kernelsu.ko"
          exit 1
        fi
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
